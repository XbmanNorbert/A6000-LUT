name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------- 关键步骤：定位 Gradle 项目根目录 ----------
      - name: Locate Gradle project root
        id: locate_gradle
        run: |
          # 查找包含 settings.gradle 或 settings.gradle.kts 的目录
          GRADLE_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -1)
          if [ -z "$GRADLE_DIR" ]; then
            echo "❌ No Gradle project found (settings.gradle missing)"
            exit 1
          fi
          echo "✅ Found Gradle project at: $GRADLE_DIR"
          echo "gradle_dir=$GRADLE_DIR" >> $GITHUB_OUTPUT   # 保存到输出变量
          # 同时列出该目录内容，便于排查
          ls -la "$GRADLE_DIR"

      # ---------- 生成 Gradle Wrapper ----------
      - name: Generate Gradle Wrapper
        run: |
          cd ${{ steps.locate_gradle.outputs.gradle_dir }}
          gradle wrapper
          chmod +x gradlew

      # ---------- 构建 Debug APK ----------
      - name: Build Debug APK
        run: |
          cd ${{ steps.locate_gradle.outputs.gradle_dir }}
          ./gradlew assembleDebug

      # ---------- 上传 APK ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RingtoneApp-debug
          # 注意：这里需要根据实际构建输出的路径来写，
          # 通常模块名是 app，但请根据上一步列出的目录结构调整。
          # 常见的路径是：模块名/build/outputs/apk/debug/xxx.apk
          path: ${{ steps.locate_gradle.outputs.gradle_dir }}/app/build/outputs/apk/debug/*.apkRun cd android   # 如果项目根目录下有 android/ 子目录，改为这个；否则删除这一行
