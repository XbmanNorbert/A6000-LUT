name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------- 调试：查看目录结构 ----------
      - name: Debug directory structure
        run: |
          pwd
          ls -la
          find . -name "settings.gradle*" -o -name "build.gradle*" | head -20

      # ---------- 生成 Gradle Wrapper ----------
      # 假设 Android 项目在 android/ 子目录下，请根据上面的输出调整 cd 路径
      - name: Generate Gradle Wrapper
        run: |
          cd android   # 如果项目根目录下有 android/ 子目录，改为这个；否则删除这一行
          gradle wrapper
          chmod +x gradlew

      # ---------- 构建 Debug APK ----------
      - name: Build Debug APK
        run: |
          cd android   # 同样要切换到同一目录
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RingtoneApp-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk   # 路径也要相应调整
